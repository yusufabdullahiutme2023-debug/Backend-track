name: Solana transaction replay

on:
  workflow_dispatch:
    inputs:
      launch_signature:
        description: 'Confirmed Pump.fun create/create_v2 transaction signature (public)'
        required: true
        type: string
      buy_signature:
        description: 'Confirmed buy transaction signature for that mint (public)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder requirements
        run: python -m pip install 'pydantic==2.13.5'
      - name: Replay transactions (no transactions sent)
        working-directory: backend-track
        env:
          SOLANA_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          LAUNCH_SIGNATURE: ${{ inputs.launch_signature }}
          BUY_SIGNATURE: ${{ inputs.buy_signature }}
        run: |
          if [ -z "$SOLANA_RPC_URL" ]; then
            echo 'Missing HELIUS_RPC_URL repository Actions secret.' >&2
            exit 1
          fi
          python pump_replay.py "$LAUNCH_SIGNATURE" "$BUY_SIGNATURE"
