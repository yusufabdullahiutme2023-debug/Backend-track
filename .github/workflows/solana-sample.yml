name: Validate historical Pump.fun creation

on:
  push:
    branches: [arena/01a0ed1a-backend-track]

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder requirements
        run: python -m pip install 'pydantic==2.13.5' 'pyarrow>=18,<25'
      - name: Bounded read-only RPC sample
        working-directory: backend-track
        env:
          SOLANA_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
        run: |
          if [ -z "$SOLANA_RPC_URL" ]; then
            echo 'Missing HELIUS_RPC_URL Actions secret' >&2
            exit 1
          fi
          set +e
          python pump_historical_sample.py > replay-result.txt 2>&1
          result=$?
          cat replay-result.txt
          if [ "$result" -ne 0 ]; then
            echo "::error::$(tail -n 1 replay-result.txt | head -c 200)"
          else
            python - <<'PY'
          import json
          text = open('replay-result.txt').read()
          result = json.loads(text[text.index('{'):])
          entry = result['validated_launch']
          buys = result['validated_buys']
          print('::notice::Verified historical launch: ' + entry['signature'] +
                ' mint=' + entry['mint'] + ' slot=' + str(entry['slot']) +
                ' sampled_buy_count=' + str(len(buys)) +
                ' buyer_validation=' + result['buyer_validation'])
          for buy in buys[:3]:
              print('::notice::Verified sampled buy: ' + buy['signature'] +
                    ' wallet=' + buy['wallet'] + ' slot=' + str(buy['slot']))
          PY
          fi
          {
            echo '### Bounded Pump.fun replay'
            echo '```text'
            cat replay-result.txt
            echo '```'
            echo "Exit status: $result"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
