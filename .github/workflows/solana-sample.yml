name: Sample real Pump.fun transactions

on:
  push:
    branches: [arena/01a0ed1a-backend-track]

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder requirements
        run: python -m pip install 'pydantic==2.13.5'
      - name: Bounded read-only RPC sample
        working-directory: backend-track
        env:
          SOLANA_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
        run: |
          if [ -z "$SOLANA_RPC_URL" ]; then
            echo 'Missing HELIUS_RPC_URL Actions secret' >&2
            exit 1
          fi
          set +e
          python pump_discover.py > replay-result.txt 2>&1
          result=$?
          cat replay-result.txt
          {
            echo '### Bounded Pump.fun replay'
            echo '```text'
            cat replay-result.txt
            echo '```'
            echo "Exit status: $result"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
