# Dedicated read-only watcher. This Blueprint does NOT replace the existing web API.
# Creating this service starts paid compute; review costs and Helius quota first.
services:
  - type: worker
    name: backend-track-pump-worker
    runtime: python
    branch: main
    rootDir: backend-track
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: python pump_worker.py
    envVars:
      - key: SOLANA_RPC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # `program` listens to every Pump transaction; `creations` listens only to launches and is far
      # cheaper, but switch only after the live comparison in the README shows it misses nothing.
      - key: PUMP_WORKER_STREAM
        value: program
