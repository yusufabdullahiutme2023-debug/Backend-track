# Dedicated read-only watcher. This Blueprint does NOT replace the existing web API.
# Creating this service starts paid compute; review costs and Helius quota first.
services:
  - type: worker
    name: backend-track-pump-worker
    runtime: python
    branch: main
    rootDir: backend-track
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: python pump_worker.py
    envVars:
      - key: SOLANA_RPC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # `creations` listens only to launches. A live comparison (see the README) found it delivered every
      # launch the whole-program stream did, at about 1/60 of the credits. Set `program` to go back to
      # listening to every Pump transaction; switching starts a new cursor ("monitor from now").
      - key: PUMP_WORKER_STREAM
        value: creations
